<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link href="https://api.fontshare.com/css?f[]=chillax@200,300,400,500,600,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
        <title>Passé Décomposé</title>

    </head>
    <body>

        <div class="header">
            <div class="circle"><button></button></div>
            <div class="circle"><button></button></div>
            <div class="circle"><button></button></div>
            <div class="idcodiv">
                <button onclick="contactus()" id="connection">Nous contacter</button>
            </div>
        </div>

        <div class="main">

            <div class="summary">
                
            </div>

            <div class="content">

            </div>

            <div class="forms">
                
                <form id="contact-form">
                
                    <div class="form-group">
                        <label for="contact-name">Nom</label>
                        <input
                            type="text"
                            id="contact-name"
                            name="name"
                            placeholder="Ton nom"
                            maxlength="100"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-email">Adresse e-mail</label>
                        <input
                            type="email"
                            id="contact-email"
                            name="email"
                            placeholder="exemple@email.com"
                            maxlength="254"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-subject">Objet</label>
                        <input
                            type="text"
                            id="contact-subject"
                            name="subject"
                            placeholder="Objet du message"
                            maxlength="150"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea
                            id="contact-message"
                            name="message"
                            placeholder="Écris ton message..."
                            maxlength="5000"
                            required
                        ></textarea>
                    </div>
                
                    <button type="submit" id="contact-submit">
                        Envoyer le message
                    </button>
                
                    <p id="contact-status" role="status" aria-live="polite"></p>
                
                </form>

            </div>

        </div>

        <script src="script.js"></script>

    </body>
</html>
