    <body>

        <div class="header">
            <div class="circle"><button></button></div>
            <div class="circle"><button></button></div>
            <div class="circle"><button></button></div>
            <div class="idcodiv">
                <button type="button" onclick="contactus()" id="connection">Nous contacter</button>
            </div>
        </div>

        <div class="main">

            <div class="summary">
                
            </div>

            <div class="content">
                <p>Contenu à venir !</p>
            </div>

            <div class="forms" id="contact-overlay" aria-hidden="true">

                <div class="form-window" role="dialog" aria-modal="true" aria-labelledby="contact-title">

                    <div class="form-header">
                        <div class="circle"><button type="button" onclick="closeContact()" aria-label="Fermer"></button></div>
                        <div class="circle"><button type="button" tabindex="-1" aria-hidden="true"></button></div>
                        <div class="circle"><button type="button" tabindex="-1" aria-hidden="true"></button></div>
                        <span class="form-title" id="contact-title">Nous contacter</span>
                    </div>

                
                <form id="contact-form">
                
                    <div class="form-group">
                        <label for="contact-name">Nom</label>
                        <input
                            type="text"
                            id="contact-name"
                            name="name"
                            placeholder="Ton nom"
                            maxlength="100"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-email">Adresse e-mail</label>
                        <input
                            type="email"
                            id="contact-email"
                            name="email"
                            placeholder="exemple@email.com"
                            maxlength="254"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-subject">Objet</label>
                        <input
                            type="text"
                            id="contact-subject"
                            name="subject"
                            placeholder="Objet du message"
                            maxlength="150"
                            required
                        >
                    </div>
                
                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea
                            id="contact-message"
                            name="message"
                            placeholder="Écris ton message..."
                            maxlength="5000"
                            required
                        ></textarea>
                    </div>
                
                    <button type="submit" id="contact-submit">
                        Envoyer le message
                    </button>
                
                    <p id="contact-status" role="status" aria-live="polite"></p>
                
                </form>

                </div>

            </div>

        </div>

        <script src="script.js"></script>

    </body>
</html>
